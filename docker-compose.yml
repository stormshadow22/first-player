services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_MOCK: "1"
      DEDUP_ENABLED: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 10
