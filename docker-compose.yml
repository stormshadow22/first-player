services:
  api:
    build:
      context: .
      secrets:
        - proxy_ca
    ports:
      - "8000:8000"
    environment:
      LLM_MOCK: "1"
      DEDUP_ENABLED: "0"
    volumes:
      - ./reports/raw:/service/reports/raw
      - ./data:/service/data:ro
      - ./models:/service/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

secrets:
  proxy_ca:
    file: ${SUPPORT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
